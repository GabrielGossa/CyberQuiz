{% extends 'base.html' %}
{% block title %}Fin du quiz - CyberQuiz{% endblock %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card shadow-sm text-center">
        <div class="card-body">
          <h2 class="h4">Bravo !</h2>
          <p class="fs-5">Votre score final est de <strong>{{ score }}</strong> sur {{ total }} question(s).</p>
          <div class="d-grid gap-2">
            <a class="btn btn-primary" href="{{ url_for('scores') }}">Voir le classement</a>
            <a class="btn btn-outline-secondary" href="{{ url_for('index') }}">Rejouer</a>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
